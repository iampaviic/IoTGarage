name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"          # oldest Python we support on the Jetson Nano
            os: ubuntu-24.04       # setup-python has no 3.8 build for newer Ubuntu
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: SOFTWARE/requirements-dev.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr mosquitto
      - name: Install
        working-directory: SOFTWARE
        run: pip install -r requirements-dev.txt
      - name: Tests (unit + end-to-end simulation)
        working-directory: SOFTWARE
        run: pytest -q

  varijanta-b:
    name: Varijanta B - rule chain in a real ThingsBoard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SOFTWARE/requirements-dev.txt
      - name: Start ThingsBoard CE
        run: docker compose -f SOFTWARE/thingsboard/docker-compose.yml up -d
      - name: Install
        working-directory: SOFTWARE
        run: pip install -r requirements-dev.txt
      - name: Wait for ThingsBoard
        # the first start installs the database and loads the demo tenant; ready when the tenant can log in
        # (during the installation ThingsBoard already answers HTTP, so wait for a real token)
        run: >-
          timeout 900 bash -c 'until curl -s -X POST -H "Content-Type: application/json"
          -d "{\"username\":\"tenant@thingsboard.org\",\"password\":\"tenant\"}"
          http://localhost:8080/api/auth/login | grep -q token; do sleep 5; done'
      - name: Provision (devices, tokens, rule chain, dashboards)
        working-directory: SOFTWARE
        run: python thingsboard/provision/provision.py --demo-pricing
      - name: Scenario with simulated devices + decide.tbel checks
        working-directory: SOFTWARE
        env:
          TB_LIVE_TEST: "1"
        run: pytest -v integracija/tests/test_varijanta_b.py
      - name: ThingsBoard log
        if: failure()
        run: docker logs garage-thingsboard 2>&1 | tail -300

  firmware:
    name: ESP32 firmware build + native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('**/platformio.ini') }}
      - run: pip install platformio
      - name: Spot sensors - unit tests
        run: pio test -e native -d SOFTWARE/senzori/firmware
      - name: Spot sensors - build
        run: pio run -e esp32dev -d SOFTWARE/senzori/firmware
      - name: Gates - unit tests
        run: pio test -e native -d SOFTWARE/rampe/firmware
      - name: Gates - build
        run: pio run -e esp32dev -d SOFTWARE/rampe/firmware

  cad:
    name: 3D parts compile (OpenSCAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render every part
        run: |
          cd SOFTWARE/maketa/3d
          for f in *.scad; do openscad -o "/tmp/${f%.scad}.stl" "$f"; done
      - name: Compile the whole-model assembly
        run: |
          openscad -o /tmp/sklop.csg SOFTWARE/maketa/3d/sklop/sklop_makete.scad
          openscad -o /tmp/komponente.csg SOFTWARE/maketa/3d/sklop/komponente.scad
