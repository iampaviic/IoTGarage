# Local MQTT broker for the edge computer (Mosquitto 2.x).
# Development setting: anonymous access on the local network.
# For the final demo set a password: mosquitto_passwd -c passwd garage ; then
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# keep retained states (spots, gates) across broker restarts
autosave_interval 60
log_type error
log_type warning
log_type notice
