; ESP32 firmware for the entrance and exit barrier (osoba 4)
; Build + upload:  pio run -t upload        Serial monitor: pio device monitor
; Unit tests of the state machine on the PC:  pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
    madhephaestus/ESP32Servo@^3.0

[env:native]
platform = native
build_flags = -std=c++11
test_build_src = no
lib_compat_mode = off
