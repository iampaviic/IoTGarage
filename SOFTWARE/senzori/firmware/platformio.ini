; ESP32 firmware for the parking spot sensors (osoba 3)
; Build + upload:  pio run -t upload        Serial monitor: pio device monitor
; Unit tests of the filter on the PC (no board needed):  pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
    adafruit/Adafruit NeoPixel@^1.12

[env:native]
platform = native
build_flags = -std=c++11
test_build_src = no
lib_compat_mode = off
