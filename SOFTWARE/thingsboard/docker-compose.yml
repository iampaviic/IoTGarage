# ThingsBoard Community Edition for development and the demo.
#
#   docker compose up -d            first start installs the database (~2 min)
#   docker compose logs -f thingsboard
#   open http://localhost:8080      tenant@thingsboard.org / tenant   (change the password!)
#   docker compose down             stop - data stays in the named volumes
#
# Data (devices, dashboards, telemetry history) lives in the volumes tb-data and
# tb-logs, so restarting or recreating the container never loses configuration
# or history (project criterion). Only `docker compose down -v` deletes it.
#
# Ports: 8080 web UI + REST API, 1883 MQTT device API of ThingsBoard (varijanta B: the ESP32s
# and the ALPR service connect here). If Mosquitto (varijanta A) runs on the same machine,
# use "1884:1883" instead and set TB_MQTT_PORT=1884 / TB_PORT 1884 in the firmware.
services:
  thingsboard:
    image: thingsboard/tb-postgres:4.2.1.1
    container_name: garage-thingsboard
    restart: unless-stopped
    ports:
      - "8080:9090"
      - "1883:1883"
    environment:
      TB_QUEUE_TYPE: in-memory
      # load demo users (tenant@thingsboard.org / tenant) on the first start
      LOAD_DEMO: "true"
      # keep 30 days of telemetry (privacy: no unlimited history of plates)
      SQL_TTL_TS_TS_KEY_VALUE_TTL: "2592000"
      JAVA_OPTS: "-Xms512M -Xmx1536M"
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard

volumes:
  tb-data:
    name: garage-tb-data
  tb-logs:
    name: garage-tb-logs
