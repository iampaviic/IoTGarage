# Edge service configuration. Copy to edge.yaml (git-ignored) and adjust.
# Environment variables MQTT_HOST, MQTT_PORT, GARAGE_DB, GARAGE_SPOTS,
# PRICING_PROFILE and ALPR_SOURCE override these values.

mqtt:
  host: localhost          # Mosquitto on the edge computer itself
  port: 1883

garage:
  spots: 6                 # must match the sensor firmware (P01..P06)

database: data/garage.db   # SQLite, see osoba-8-baza-testovi
pricing: demo              # demo = 1 minute billed as 1 hour; real = 15 min free, 1.50 EUR/started hour

access:
  policy: open             # open: any valid plate may enter | allowlist: only plates in the allow-list
  accept_threshold: 0.85   # >= -> automatic decision
  retry_threshold: 0.60    # 0.60..0.85 -> new photo; below -> manual approval
  max_attempts: 3          # photos per vehicle before asking the operator
  retry_delay_s: 0.5
  gate_ack_timeout_s: 3    # gate must confirm a command within this time (then 1 resend, then alarm)
  gate_command_retries: 1
  alpr_timeout_s: 10       # ALPR service must answer a trigger within this time
  spot_timeout_s: 90       # no telemetry for this long -> spot state UNKNOWN
  exit_fuzzy_match: false  # true: at the exit accept an active session whose plate differs by 1 character
  alpr_failure_alert_after: 3

alpr:
  source: camera           # camera | sim (synthetic frames, no hardware) | images (folder of photos)
  camera: "0"              # /dev/video0; or a video file / RTSP URL / GStreamer pipeline
  width: 1280
  height: 720
  images_dir: null         # for source: images
  frames_per_trigger: 3    # frames analysed per trigger, the best reading wins
  gates:
    # Variant B (one camera): the same camera is moved between the entrance and the
    # exit mount, so both gates read the whole frame.
    # Variant A (recommended, two cameras): give each gate its own `camera`.
    # `roi` limits the search to part of the frame: [x0, y0, x1, y1] as fractions.
    entrance:
      camera_id: entrance-camera
      roi: null
      # camera: "0"
    exit:
      camera_id: exit-camera
      roi: null
      # camera: "1"

privacy:
  save_crops: false        # store plate crops (never full frames) for debugging
  crops_dir: data/crops
  retention_days: 30       # older crops are deleted at start-up
